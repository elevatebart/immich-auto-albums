<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// The theme is class driven with no media fallback, so resolve it before the first paint.
			try {
				const stored = JSON.parse(localStorage.getItem('immich-ui-theme') ?? '""');
				const dark =
					stored === 'dark' ||
					(stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.add(dark ? 'dark' : 'light');
			} catch {
				// no storage, the light default applies
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
