name: release

on:
  push:
    branches: [main]

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      version: ${{ steps.released.outputs.version }}
    steps:
      # Full history: changeset git-tag reads existing tags to know what is already released.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # With changesets pending this opens or updates the Version Packages PR. With none left
      # (the PR just merged) it runs the publish script, which tags v<version> and nothing else.
      - id: changesets
        uses: changesets/action@v2.1.2
        with:
          publish-script: npx changeset git-tag
      - id: released
        if: steps.changesets.outputs.published == 'true'
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  # Called directly rather than triggered by the tag: tags pushed with GITHUB_TOKEN start no workflow.
  image:
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      version: ${{ needs.release.outputs.version }}
