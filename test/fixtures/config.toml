# Config for the golden tests. Same thresholds as the real one, invented people and homes.
# Do not point a live run at this file.

[immich]
url = "http://localhost:2283"
out_dir = "."                                   # logs and decision CSVs
window_days = 365                               # rolling recompute window; WINDOW_DAYS env overrides
marker = "[auto-albums]"                        # album description prefix; only tagged albums are ever touched

[people]
me = "Sam Rivers"
household = ["Sam Rivers", "Nadia Rivers", "Theo Rivers"]
with_share = 0.4          # share of a trip's face-tagged photos a guest must appear in to be named
with_min_tagged = 5       # minimum face-tagged photos before naming anyone
max_named = 3
no_people_places = ["Versoix", "Bilieu"]

# Homes, in chronological order. Each applies until the next one starts.
[[homes]]
from = 2002-01-01
lat = 38.722
lon = -9.139
label = "Lisbon"

[[homes]]
from = 2007-10-01
lat = 41.150
lon = -8.610
label = "Porto"

[[homes]]
from = 2012-02-28
lat = 52.520
lon = 13.405
label = "Berlin"

[[homes]]
from = 2016-01-01
lat = 48.208
lon = 16.373
label = "Vienna"

[[homes]]
from = 2023-06-08
lat = 45.190
lon = 5.720
label = "Grenoble"

[clustering]
home_km = 20
place_km = 5
place_km_max = 25
merge_label_km = 15
dominant_share = 0.75
region_share = 0.8
zone_share = 0.6
trip_gap_hours = 72
trip_min_photos = 10
trip_min_days = 2
daytrip_min_photos = 15
gather_gap_hours = 2
gather_min_photos = 30
gather_min_guests = 3
event_absorb_share = 0.5

[person_years]
min_photos = 50
household_min_photos = 10

[seasons]
no_gps_era_end = 2012-03-01   # seasonal buckets only for GPS-less photos before this date
min_photos = 5

# Named areas that beat the district when a trip mostly happened inside one. Entries sharing a
# name are one area, so a range can be several tight circles that leave the valleys between out.
[[zones]]
name = "Mountains around Grenoble"
lat = 45.05
lon = 6.03
km = 12

[[zones]]
name = "Mountains around Grenoble"
lat = 44.95
lon = 5.83
km = 12

# Countries named after their district (a French departement) instead of their region,
# and the regions that keep naming albums anyway.
[naming]
district_countries = ["France"]
keep_regions = ["Normandy", "Île-de-France"]

# Geocoder label -> name used in albums. Applies to cities, districts and states.
[aliases]
"Île-de-France" = "Paris"
"City of Westminster" = "London"
"Manhattan" = "New York City"
"Ipanema" = "Rio de Janeiro"
"Lincolnwood" = "Chicago"
"Coppet" = "Versoix"
"Gex" = "Versoix"
"Divonne-les-Bains" = "Versoix"

# Hand-declared events: every photo in the inclusive range, GPS or not.
[[events]]
name = "Our wedding"
from = 2019-08-30
to = 2019-09-01

[[events]]
name = "Engagement celebration"
from = 2018-08-23
to = 2018-08-26
