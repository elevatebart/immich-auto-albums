# The UI, which runs wherever you write config.toml. The CLI runs on the NAS from the published
# image, see README.md.
services:
  ui:
    image: immich-auto-albums:latest
    build:
      context: .
    command: serve
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
    volumes:
      # Holds config.toml, receives the logs and CSVs. Copy the config to the NAS share when done.
      # ./data/.env is the place for IMMICH_API_KEY, and for IMMICH_URL when it is not the one in
      # config.toml. Immich on this same machine is http://host.docker.internal:2283, not localhost.
      - ./data:/data
